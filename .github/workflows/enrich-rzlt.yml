name: Enrich RZLT parcels

# The enrichment joins four third-party datasets (planning applications,
# state ownership, valuations, OSM footprints) and needs shapely/pyproj, so
# it runs weekly and separately from the stdlib-only twice-daily refresh.
on:
  schedule:
    # 03:17 UTC every Monday.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python and dependencies
        run: uv sync

      # The enrichment reads data/rzlt_sites.geojson; refresh it first so the
      # parcel set and geometry match the current register.
      - name: Refresh RZLT parcels
        run: uv run python scripts/fetch_rzlt.py

      # Cached responses never expire, so the cache is scoped to the ISO
      # week: re-runs within a week stay cheap, and each weekly run fetches
      # fresh upstream data rather than replaying an old cache.
      - name: Compute cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore enrichment cache
        uses: actions/cache@v6
        with:
          path: cache
          key: rzlt-enrich-cache-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            rzlt-enrich-cache-${{ steps.week.outputs.week }}-

      - name: Enrich RZLT parcels
        run: uv run python scripts/enrich_rzlt.py

      - name: Export GeoParquet
        run: uv run python scripts/export_geoparquet.py

      - name: Commit and push if enrichment changed
        run: |
          if git diff --quiet -- data/rzlt_sites_enriched.geojson data/rzlt_sites_enriched.csv data/rzlt_sites_enriched.parquet; then
            echo "No changes to enriched RZLT data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rzlt_sites_enriched.geojson data/rzlt_sites_enriched.csv data/rzlt_sites_enriched.parquet data/rzlt_run_manifest.json data/rzlt_sites.geojson data/rzlt_sites.csv data/rzlt_sites.parquet
          git commit -m "Enrich RZLT parcels ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
